{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="POST" class="stack-form" data-validate="register-form" novalidate>
  <label>Role
    <select name="role" id="role-select">
      <option value="patient">Patient</option>
      <option value="clinician">Clinician</option>
    </select>
  </label>
  <label>
    <span id="id-hint">User ID (8 digits — patient IDs end in a registration year
    between 2022 and 2028, e.g. 12342024)</span>
    <input type="text" name="user_id" id="user-id-input" pattern="\d{8}" maxlength="8" required>
  </label>
  <p class="field-error" data-error-for="user_id" hidden></p>
  <label>Full Name
    <input type="text" name="name" required>
  </label>
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>
    Password (8+ chars, upper, lower, digit, special character e.g. !@#$%^&amp;*)
    <input type="password" name="password" id="password-input" required>
  </label>
  <p class="field-error" data-error-for="password" hidden></p>
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
